[project]
name = "bank-churn"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "amineche", email = "chebbimamine@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
bank-churn = "bank_churn:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipywidgets>=8.1.9",
]
